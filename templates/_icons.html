{% macro icon(name, size=21) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'brand' %}<path d="M12 2 18.5 9.5 12 22 5.5 9.5 12 2Z"/><path d="M5.5 9.5h13M12 2v20M8.5 9.5 12 22l3.5-12.5"/>
{% elif name == 'home' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{% elif name == 'image' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m3 17 5-4 4 3 4-5 5 5"/>
{% elif name == 'edges' %}<path d="M3 18h4V6h5v12h5V6h4"/>
{% elif name == 'histogram' %}<path d="M3 3v18h18M7 17v-4m4 4V7m4 10V9m4 8v-5"/>
{% elif name == 'features' %}<circle cx="7" cy="7" r="3"/><circle cx="17" cy="17" r="3"/><path d="m9 9 6 6m2-11v6m-3-3h6M7 14v6m-3-3h6"/>
{% elif name == 'face' %}<path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5m5-6v1m8-1v1m-7 4q3 3 6 0"/>
{% elif name == 'detect' %}<path d="M3 8V3h5m8 0h5v5m0 8v5h-5m-8 0H3v-5"/><rect x="8" y="8" width="8" height="8" rx="1"/>
{% elif name == 'segment' %}<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>
{% elif name == 'book' %}<path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/>
{% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>
{% elif name == 'play' %}<path d="m8 5 11 7-11 7z" fill="currentColor"/>
{% elif name == 'upload' %}<path d="M12 16V4m-4 4 4-4 4 4M4 15v5h16v-5"/>
{% elif name == 'menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% elif name == 'code' %}<path d="m7 7-5 5 5 5m10-10 5 5-5 5m-3-14-4 18"/>
{% endif %}
</svg>
{%- endmacro %}
